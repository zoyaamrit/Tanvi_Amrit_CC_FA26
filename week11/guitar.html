<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII Strings</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
</head>
<body>
  <main id="stage"></main>

  <!-- Audio can only start after a click, so the sketch opens behind this. -->
  <div id="start">
    <div class="card">
      <h1>ASCII Strings</h1>
      <p>Sweep your index fingers (or the mouse) across the three strings to pluck them.
         Where you cross a string along its length sets the note.</p>
      <button id="startBtn" type="button">Start</button>
      <p class="hint">Allow the camera when asked. Works without one, using the mouse.</p>
    </div>
  </div>

  <div id="hud">
    <div class="row">
      <button id="recBtn" type="button" title="R">Record</button>
      <button id="playBtn" type="button" title="Space" disabled>Stop</button>
      <button id="undoBtn" type="button" title="U" disabled>Undo layer</button>
      <button id="clearBtn" type="button" title="C" disabled>Clear</button>
      <span id="status">No loop yet</span>
      <span id="tracker"></span>
    </div>
    <div id="bar"><div id="fill"></div></div>
  </div>

  <script src="guitar.js"></script>
</body>
</html>
