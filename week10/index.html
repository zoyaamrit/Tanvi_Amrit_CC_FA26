<head>
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
      <!-- <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script> -->
     <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

     

  <link rel="stylesheet" href="../../style.css" />
</head>
<body>



    <div id="menu">
      <a href="../index.html"> << </a>
        <a href="?sketch=sketch1.js">modify speed </a>
        <a href="?sketch=sketch2.js">drawing</a>

    </div>

    <script>
      const allowed = ["sketch1.js", "sketch2.js"];
      let chosen = new URLSearchParams(location.search).get("sketch");
      if (!allowed.includes(chosen)) chosen = "sketch2.js"; 

      document.querySelectorAll("#menu a").forEach(a => {
        if (a.getAttribute("href") === "?sketch=" + chosen) a.classList.add("active");
      });

      // load only the chosen sketch
      const s = document.createElement("script");
      s.src = chosen;
      document.body.appendChild(s);
    </script>

  </body>
